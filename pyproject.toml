[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lrcparser"
version = "0.1.2"
authors = [{ name = "283375", email = "log_283375@163.com" }]
description = "A simple lyric file parser"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
"Homepage" = "https://github.com/283375/lrcparser_python"
"Bug Tracker" = "https://github.com/283375/lrcparser_python/issues"

[tool.setuptools]
packages = ["lrcparser"]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "pytest-cov>=5"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.2,<2",
  "mkdocstrings[python]>=0.27; python_version >= '3.9'",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "N"]
